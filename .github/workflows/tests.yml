name: Portfolio tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install 'pillow>=10,<13'
      - name: Run offline Python tests
        run: python -m unittest -q test_bot test_freshness_v4 test_bridge_v5 test_embedded_v6

  javascript-tests:
    name: JavaScript matcher tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Node.js matcher tests
        run: node --test test_matcher_v6.js
