name: Offline Python and matcher tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mock-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install 'pillow>=10,<13'
      - run: python -m unittest -q test_bot test_freshness_v4 test_bridge_v5 test_embedded_v6 test_failures
      - run: node --test test_matcher_v6.js
